<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      background: #10b981;
      color: white;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .status-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border: 1px solid #334155;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">CS</div>
    <div class="title">ChatSpace Bridge</div>
  </div>

  <div class="status-box">
    <span class="status-indicator" id="ind"></span>
    <span id="status-text">Связь со шлюзом активна</span>
  </div>

  <div>
    <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Токен оператора (JWT):</label>
    <input type="text" id="token-input" placeholder="Вставьте токен или войдите в панель" />
    <button id="save-btn">Сохранить токен</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
